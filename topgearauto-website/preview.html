<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TopGear Auto — premium pre-owned vehicles, expert service and financing you can trust."
    />
    <title>TopGear Auto | Premium Pre-Owned Vehicles &amp; Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0d10;
        --bg-soft: #12151a;
        --card: #171b21;
        --border: rgba(255, 255, 255, 0.08);
        --text: #f4f6f8;
        --text-muted: #9aa3ad;
        --accent: #e63946;
        --accent-soft: rgba(230, 57, 70, 0.12);
        --radius: 16px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg); color: var(--text); line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; text-decoration: none; }
      img { max-width: 100%; display: block; }
      .container { width: min(1140px, 92%); margin: 0 auto; }
      .section { padding: 96px 0; }
      .section-label {
        display: inline-block; color: var(--accent); font-size: 0.8rem; font-weight: 700;
        letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 12px;
      }
      .section-title {
        font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800;
        letter-spacing: -0.02em; margin-bottom: 16px;
      }
      .section-subtitle { color: var(--text-muted); max-width: 560px; margin-bottom: 48px; }
      .btn {
        display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px;
        border-radius: 999px; font-weight: 600; font-size: 0.95rem; border: 1px solid transparent;
        cursor: pointer; transition: background 0.2s ease, border-color 0.2s ease;
      }
      .btn-primary { background: var(--accent); color: #fff; }
      .btn-primary:hover { background: #d62839; }
      .btn-ghost { border-color: var(--border); color: var(--text); background: transparent; }
      .btn-ghost:hover { border-color: rgba(255, 255, 255, 0.3); }
      .btn:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

      .navbar {
        position: fixed; inset: 0 0 auto 0; z-index: 50; backdrop-filter: blur(14px);
        background: rgba(11, 13, 16, 0.72); border-bottom: 1px solid var(--border);
      }
      .navbar-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }
      .brand { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.01em; }
      .brand span { color: var(--accent); }
      .nav-links { display: flex; align-items: center; gap: 32px; list-style: none; }
      .nav-links a { font-size: 0.92rem; color: var(--text-muted); transition: color 0.2s ease; }
      .nav-links a:hover { color: var(--text); }
      .nav-cta { padding: 10px 22px; }
      @media (max-width: 760px) { .nav-links { display: none; } }

      .hero {
        position: relative; min-height: 100vh; display: flex; align-items: center; overflow: hidden;
        background:
          radial-gradient(1100px 500px at 80% -10%, rgba(230, 57, 70, 0.18), transparent 60%),
          radial-gradient(800px 400px at 10% 110%, rgba(69, 123, 157, 0.16), transparent 60%),
          var(--bg);
      }
      .hero-grid {
        display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 48px;
        align-items: center; padding-top: 72px;
      }
      .hero h1 {
        font-size: clamp(2.4rem, 6vw, 4rem); font-weight: 800; line-height: 1.1;
        letter-spacing: -0.03em; margin-bottom: 20px;
      }
      .hero h1 em { font-style: normal; color: var(--accent); }
      .hero p { color: var(--text-muted); font-size: 1.05rem; max-width: 480px; margin-bottom: 32px; }
      .hero-actions { display: flex; flex-wrap: wrap; gap: 16px; }
      .hero-visual {
        position: relative; border-radius: var(--radius); overflow: hidden;
        border: 1px solid var(--border); aspect-ratio: 4 / 3;
      }
      .hero-visual img { width: 100%; height: 100%; object-fit: cover; }
      .hero-badge {
        position: absolute; bottom: 20px; left: 20px; background: rgba(11, 13, 16, 0.85);
        backdrop-filter: blur(8px); border: 1px solid var(--border); border-radius: 12px;
        padding: 12px 18px; font-size: 0.85rem;
      }
      .hero-badge strong { display: block; font-size: 1.1rem; }
      @media (max-width: 860px) {
        .hero-grid { grid-template-columns: 1fr; padding-top: 110px; padding-bottom: 60px; }
      }

      .stats { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--bg-soft); }
      .stats-grid {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
        padding: 48px 0; text-align: center;
      }
      .stat-value { font-size: 2.2rem; font-weight: 800; color: var(--accent); }
      .stat-label { color: var(--text-muted); font-size: 0.9rem; }
      @media (max-width: 760px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }

      .cars-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
      .car-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
      .car-card img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
      .car-card-body { padding: 20px; }
      .car-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
      .car-meta { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 14px; }
      .car-price-row { display: flex; align-items: center; justify-content: space-between; }
      .car-price { font-size: 1.15rem; font-weight: 800; }
      .car-link { color: var(--accent); font-size: 0.88rem; font-weight: 600; }
      @media (max-width: 860px) { .cars-grid { grid-template-columns: 1fr; } }

      .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
      .service-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; }
      .service-icon {
        display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px;
        border-radius: 12px; background: var(--accent-soft); font-size: 1.4rem; margin-bottom: 18px;
      }
      .service-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
      .service-card p { color: var(--text-muted); font-size: 0.92rem; }
      @media (max-width: 860px) { .services-grid { grid-template-columns: 1fr; } }

      .testimonials-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
      .testimonial-card {
        background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 28px; display: flex; flex-direction: column; gap: 16px;
      }
      .testimonial-card blockquote { color: var(--text-muted); font-size: 0.95rem; }
      .testimonial-author { display: flex; flex-direction: column; }
      .testimonial-author strong { font-size: 0.95rem; }
      .testimonial-author span { color: var(--text-muted); font-size: 0.82rem; }
      .testimonial-stars { color: #f4b400; letter-spacing: 2px; }
      @media (max-width: 860px) { .testimonials-grid { grid-template-columns: 1fr; } }

      .cta-panel {
        background: linear-gradient(135deg, rgba(230, 57, 70, 0.18), rgba(69, 123, 157, 0.14)), var(--card);
        border: 1px solid var(--border); border-radius: 24px;
        padding: clamp(40px, 6vw, 72px); text-align: center;
      }
      .cta-panel h2 { font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 12px; }
      .cta-panel p { color: var(--text-muted); max-width: 520px; margin: 0 auto 32px; }

      .footer { border-top: 1px solid var(--border); padding: 48px 0; color: var(--text-muted); font-size: 0.88rem; }
      .footer-inner { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: space-between; }
      .footer-links { display: flex; gap: 24px; list-style: none; }
      .footer-links a:hover { color: var(--text); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      import React, { useEffect, useRef, useState } from 'https://esm.sh/react@18.3.1';
      import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
      import { motion, useInView, animate } from 'https://esm.sh/framer-motion@11.18.2?deps=react@18.3.1,react-dom@18.3.1';
      import htm from 'https://esm.sh/htm@3.1.1';

      const html = htm.bind(React.createElement);

      const fadeUp = {
        hidden: { opacity: 0, y: 32 },
        visible: { opacity: 1, y: 0, transition: { duration: 0.6, ease: 'easeOut' } },
      };
      const staggerContainer = { hidden: {}, visible: { transition: { staggerChildren: 0.12 } } };
      const scaleIn = {
        hidden: { opacity: 0, scale: 0.94 },
        visible: { opacity: 1, scale: 1, transition: { duration: 0.6, ease: 'easeOut' } },
      };
      const viewportOnce = { once: true, amount: 0.25 };

      const navLinks = [
        { label: 'Inventory', href: '#inventory' },
        { label: 'Services', href: '#services' },
        { label: 'Reviews', href: '#reviews' },
        { label: 'Contact', href: '#contact' },
      ];

      function Navbar() {
        return html`
          <${motion.header} class="navbar" initial=${{ y: -80, opacity: 0 }}
            animate=${{ y: 0, opacity: 1 }} transition=${{ duration: 0.5, ease: 'easeOut' }}>
            <div class="container navbar-inner">
              <a href="#top" class="brand" aria-label="TopGear Auto home">TopGear<span>Auto</span></a>
              <nav aria-label="Main navigation">
                <ul class="nav-links">
                  ${navLinks.map((l) => html`<li key=${l.href}><a href=${l.href}>${l.label}</a></li>`)}
                  <li><a href="#contact" class="btn btn-primary nav-cta">Book a Test Drive</a></li>
                </ul>
              </nav>
            </div>
          <//>
        `;
      }

      function Hero() {
        return html`
          <section class="hero" id="top">
            <div class="container hero-grid">
              <${motion.div} variants=${staggerContainer} initial="hidden" animate="visible">
                <${motion.h1} variants=${fadeUp}>Drive Home in the Car You <em>Deserve</em><//>
                <${motion.p} variants=${fadeUp}>
                  TopGear Auto hand-picks premium pre-owned vehicles, backs every sale with a
                  150-point inspection, and gets you financed in minutes — not days.
                <//>
                <${motion.div} class="hero-actions" variants=${fadeUp}>
                  <a href="#inventory" class="btn btn-primary">Browse Inventory</a>
                  <a href="#services" class="btn btn-ghost">Our Services</a>
                <//>
              <//>
              <${motion.div} class="hero-visual" initial=${{ opacity: 0, x: 48 }}
                animate=${{ opacity: 1, x: 0 }} transition=${{ duration: 0.8, ease: 'easeOut', delay: 0.2 }}>
                <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1200&q=80"
                  alt="Sports car on display at TopGear Auto showroom" />
                <${motion.div} class="hero-badge" initial=${{ opacity: 0, y: 20 }}
                  animate=${{ opacity: 1, y: 0 }} transition=${{ delay: 0.8, duration: 0.5 }}>
                  <strong>4.9 / 5</strong>Rated by 2,300+ happy drivers
                <//>
              <//>
            </div>
          </section>
        `;
      }

      function Counter({ value, suffix }) {
        const ref = useRef(null);
        const inView = useInView(ref, { once: true, amount: 0.6 });
        const [display, setDisplay] = useState(0);
        useEffect(() => {
          if (!inView) return;
          const controls = animate(0, value, {
            duration: 1.6, ease: 'easeOut', onUpdate: (v) => setDisplay(Math.round(v)),
          });
          return () => controls.stop();
        }, [inView, value]);
        return html`<span ref=${ref}>${display.toLocaleString()}${suffix}</span>`;
      }

      const stats = [
        { value: 15, suffix: '+', label: 'Years in Business' },
        { value: 8500, suffix: '+', label: 'Cars Sold' },
        { value: 150, suffix: '-pt', label: 'Inspection on Every Car' },
        { value: 98, suffix: '%', label: 'Customer Satisfaction' },
      ];

      function Stats() {
        return html`
          <section class="stats" aria-label="TopGear Auto by the numbers">
            <${motion.div} class="container stats-grid" variants=${staggerContainer}
              initial="hidden" whileInView="visible" viewport=${viewportOnce}>
              ${stats.map((s) => html`
                <${motion.div} key=${s.label} variants=${fadeUp}>
                  <div class="stat-value"><${Counter} value=${s.value} suffix=${s.suffix} /></div>
                  <div class="stat-label">${s.label}</div>
                <//>
              `)}
            <//>
          </section>
        `;
      }

      const cars = [
        { name: '2022 BMW M4 Competition', meta: '12,400 mi · Automatic · Petrol', price: '$72,900',
          image: 'https://images.unsplash.com/photo-1617531653332-bd46c24f2068?auto=format&fit=crop&w=900&q=80',
          alt: 'Blue BMW M4 Competition coupe' },
        { name: '2023 Tesla Model 3 Performance', meta: '8,100 mi · Automatic · Electric', price: '$46,500',
          image: 'https://images.unsplash.com/photo-1560958089-b8a1929cea89?auto=format&fit=crop&w=900&q=80',
          alt: 'White Tesla Model 3 parked outdoors' },
        { name: '2021 Ford Mustang GT', meta: '21,700 mi · Manual · Petrol', price: '$41,200',
          image: 'https://images.unsplash.com/photo-1584345604476-8ec5e12e42dd?auto=format&fit=crop&w=900&q=80',
          alt: 'Red Ford Mustang GT on the road' },
      ];

      function FeaturedCars() {
        return html`
          <section class="section" id="inventory">
            <div class="container">
              <${motion.div} variants=${staggerContainer} initial="hidden" whileInView="visible" viewport=${viewportOnce}>
                <${motion.span} class="section-label" variants=${fadeUp}>Featured Inventory<//>
                <${motion.h2} class="section-title" variants=${fadeUp}>This Week's Top Picks<//>
                <${motion.p} class="section-subtitle" variants=${fadeUp}>
                  Every vehicle passes our 150-point inspection and comes with a full history report
                  and a 7-day money-back guarantee.
                <//>
              <//>
              <${motion.div} class="cars-grid" variants=${staggerContainer} initial="hidden"
                whileInView="visible" viewport=${viewportOnce}>
                ${cars.map((c) => html`
                  <${motion.article} key=${c.name} class="car-card" variants=${fadeUp}
                    whileHover=${{ y: -8 }} transition=${{ type: 'spring', stiffness: 300, damping: 22 }}>
                    <img src=${c.image} alt=${c.alt} loading="lazy" />
                    <div class="car-card-body">
                      <h3>${c.name}</h3>
                      <p class="car-meta">${c.meta}</p>
                      <div class="car-price-row">
                        <span class="car-price">${c.price}</span>
                        <a href="#contact" class="car-link" aria-label=${'Enquire about ' + c.name}>Enquire →</a>
                      </div>
                    </div>
                  <//>
                `)}
              <//>
            </div>
          </section>
        `;
      }

      const services = [
        { icon: '🚗', title: 'Buy & Sell', description: 'Browse hand-picked pre-owned vehicles or get an instant, fair offer for your current car — paid out the same day.' },
        { icon: '💳', title: 'Fast Financing', description: 'Get pre-approved online in under 5 minutes. We work with 20+ lenders to find rates that fit your budget.' },
        { icon: '🔧', title: 'Service & Repair', description: 'Factory-trained technicians, genuine parts and transparent pricing — from oil changes to full engine work.' },
        { icon: '🛡️', title: 'Extended Warranty', description: 'Drive worry-free with coverage plans up to 5 years, honored at certified shops nationwide.' },
        { icon: '🔄', title: 'Trade-In Program', description: 'Upgrade without the hassle. Apply your trade-in value directly to any vehicle on our lot.' },
        { icon: '🚚', title: 'Home Delivery', description: 'Buy online and we deliver to your driveway within 3 days, with a 7-day money-back guarantee.' },
      ];

      function Services() {
        return html`
          <section class="section" id="services">
            <div class="container">
              <${motion.div} variants=${staggerContainer} initial="hidden" whileInView="visible" viewport=${viewportOnce}>
                <${motion.span} class="section-label" variants=${fadeUp}>What We Do<//>
                <${motion.h2} class="section-title" variants=${fadeUp}>Everything Your Car Needs, Under One Roof<//>
                <${motion.p} class="section-subtitle" variants=${fadeUp}>
                  From the day you buy to every mile after — TopGear Auto keeps you moving.
                <//>
              <//>
              <${motion.div} class="services-grid" variants=${staggerContainer} initial="hidden"
                whileInView="visible" viewport=${viewportOnce}>
                ${services.map((s) => html`
                  <${motion.div} key=${s.title} class="service-card" variants=${fadeUp}
                    whileHover=${{ y: -6, borderColor: 'rgba(230, 57, 70, 0.45)' }}
                    transition=${{ type: 'spring', stiffness: 300, damping: 22 }}>
                    <span class="service-icon" aria-hidden="true">${s.icon}</span>
                    <h3>${s.title}</h3>
                    <p>${s.description}</p>
                  <//>
                `)}
              <//>
            </div>
          </section>
        `;
      }

      const testimonials = [
        { quote: 'Found my dream M4 here. The whole process — test drive, financing, paperwork — took one afternoon. Unreal.', name: 'Marcus T.', detail: 'Bought a 2022 BMW M4' },
        { quote: 'They gave me $2,000 more for my trade-in than the dealership across town, and the new car was spotless.', name: 'Priya S.', detail: 'Trade-in customer' },
        { quote: 'Their service center has looked after both our family cars for three years. Honest quotes, zero surprises.', name: 'Dave & Karen L.', detail: 'Service customers since 2023' },
      ];

      function Testimonials() {
        return html`
          <section class="section" id="reviews">
            <div class="container">
              <${motion.div} variants=${staggerContainer} initial="hidden" whileInView="visible" viewport=${viewportOnce}>
                <${motion.span} class="section-label" variants=${fadeUp}>Reviews<//>
                <${motion.h2} class="section-title" variants=${fadeUp}>Drivers Who Took the Wheel With Us<//>
              <//>
              <${motion.div} class="testimonials-grid" variants=${staggerContainer} initial="hidden"
                whileInView="visible" viewport=${viewportOnce}>
                ${testimonials.map((t) => html`
                  <${motion.figure} key=${t.name} class="testimonial-card" variants=${fadeUp}>
                    <span class="testimonial-stars" aria-label="5 out of 5 stars">★★★★★</span>
                    <blockquote>“${t.quote}”</blockquote>
                    <figcaption class="testimonial-author">
                      <strong>${t.name}</strong><span>${t.detail}</span>
                    </figcaption>
                  <//>
                `)}
              <//>
            </div>
          </section>
        `;
      }

      function CallToAction() {
        return html`
          <section class="section" id="contact">
            <div class="container">
              <${motion.div} class="cta-panel" variants=${scaleIn} initial="hidden"
                whileInView="visible" viewport=${viewportOnce}>
                <h2>Ready for Your Next Set of Wheels?</h2>
                <p>Book a no-pressure test drive or get your free trade-in valuation today. Our team
                  replies within the hour, seven days a week.</p>
                <div class="hero-actions" style=${{ justifyContent: 'center' }}>
                  <a href="tel:+1-555-867-5309" class="btn btn-primary">Call (555) 867-5309</a>
                  <a href="mailto:sales@topgearauto.com" class="btn btn-ghost">sales@topgearauto.com</a>
                </div>
              <//>
            </div>
          </section>
        `;
      }

      function Footer() {
        return html`
          <footer class="footer">
            <div class="container footer-inner">
              <span>© ${new Date().getFullYear()} TopGear Auto. All rights reserved.</span>
              <nav aria-label="Footer navigation">
                <ul class="footer-links">
                  <li><a href="#inventory">Inventory</a></li>
                  <li><a href="#services">Services</a></li>
                  <li><a href="#reviews">Reviews</a></li>
                  <li><a href="#contact">Contact</a></li>
                </ul>
              </nav>
            </div>
          </footer>
        `;
      }

      function App() {
        return html`
          <${React.Fragment}>
            <${Navbar} />
            <main>
              <${Hero} />
              <${Stats} />
              <${FeaturedCars} />
              <${Services} />
              <${Testimonials} />
              <${CallToAction} />
            </main>
            <${Footer} />
          <//>
        `;
      }

      createRoot(document.getElementById('root')).render(html`<${App} />`);
    </script>
  </body>
</html>
